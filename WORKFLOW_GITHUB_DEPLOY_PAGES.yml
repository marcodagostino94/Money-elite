name: Pubblica Money Elite

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_BASE_PATH: /Money-elite
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v5
      - name: Configura Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Installa i componenti
        run: npm ci
      - name: Compila l’app
        run: npm run build
      - name: Prepara l’archivio GitHub Pages
        run: tar --dereference --hard-dereference --directory out -cvf "${RUNNER_TEMP}/artifact.tar" .
      - name: Carica il sito
        uses: actions/upload-artifact@v6
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v5
